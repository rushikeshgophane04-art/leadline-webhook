name: Forex compression scan

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # every 15 min, Mon-Fri (UTC)
  workflow_dispatch:           # Actions -> Run workflow

concurrency:
  group: forex-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      # Carry the alert state between runs so alerts aren't repeated.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/scan_once.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
