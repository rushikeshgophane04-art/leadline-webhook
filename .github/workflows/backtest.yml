name: Forex compression backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        interval: ["15m", "1h"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/backtest.py
        env:
          BT_INTERVAL: ${{ matrix.interval }}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ matrix.interval }}
          path: backtest_results_${{ matrix.interval }}.csv
