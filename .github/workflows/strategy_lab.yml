name: Strategy lab backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: strategy_lab/requirements.txt
      - run: pip install -r strategy_lab/requirements.txt
      - run: python strategy_lab/strategy_lab.py
      - run: python strategy_lab/system_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-results
          path: |
            strategy_lab_results.csv
            system_test_results.csv
